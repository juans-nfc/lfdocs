# Add inside the tools.northernfruit.com server block. Trailing slashes matter:
# nginx strips /lfdocs/ before proxying, and the app is told its prefix via BASE_PATH.

location = /lfdocs { return 301 /lfdocs/; }

location /lfdocs/ {
    # M365 gate, same as the other tools (optional — the app has its own Laserfiche sign-in)
    auth_request /oauth2/auth;
    error_page 401 = /oauth2/sign_in;
    auth_request_set $email $upstream_http_x_auth_request_email;
    proxy_set_header X-Auth-Request-Email $email;

    proxy_pass http://127.0.0.1:8097/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /lfdocs;
}
