<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#005a9e">
<title>LF Docs</title>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <img src="icons/favicon.png" alt="" class="logo">
  <span id="title" class="title">LF Docs</span>
  <span class="grow"></span>
  <span id="who" class="who"></span>
  <button id="signout" class="link" hidden>Sign out</button>
</header>

<main>
  <section id="login" class="card" hidden>
    <h2>Sign in to Laserfiche</h2>
    <p class="muted" id="login-repo"></p>
    <form id="login-form" autocomplete="on">
      <label>User name <input id="username" name="username" autocomplete="username" required></label>
      <label>Password <input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <div class="row">
        <button type="submit" class="primary" id="login-btn">Sign in</button>
        <span id="login-msg" class="msg"></span>
      </div>
    </form>
  </section>

  <section id="search" hidden>
    <nav id="kinds" class="tabs" hidden></nav>
    <form id="search-form" class="searchrow">
      <label for="q" id="q-label">Order #</label>
      <input id="q" name="q" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="e.g. 80670">
      <button type="submit" class="primary" id="find">Find</button>
    </form>
    <div class="openwith">
      <span class="muted-inline">Open with</span>
      <div class="seg" role="radiogroup">
        <button type="button" id="ow-web" data-ow="web">Web client</button>
        <button type="button" id="ow-win" data-ow="win">Windows client</button>
      </div>
    </div>
    <div id="status" class="status" role="status"></div>

    <div id="folder" class="folderhead" hidden>
      <div class="folderinfo">
        <div class="foldername" id="folder-name"></div>
        <div class="folderpath" id="folder-path"></div>
      </div>
      <a id="folder-open" class="primary btn" target="_blank" rel="noopener">Open folder</a>
    </div>

    <ul id="results" class="results"></ul>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
